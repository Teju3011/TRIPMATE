<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="100%" height="100%" style="background:#0f172a; font-family:'Segoe UI',sans-serif;">
  <text x="480" y="35" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="bold">TripMate — Scenario-Based Analysis Model: Collaborative Expense &amp; Debt Settlement</text>

  <!-- Lifelines (Swimlanes / Objects) -->
  <!-- 1. Traveler / Client -->
  <rect x="50" y="70" width="140" height="40" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="120" y="95" text-anchor="middle" fill="#fff" font-weight="bold" font-size="12">Traveler (Client)</text>
  <line x1="120" y1="110" x2="120" y2="670" stroke="#334155" stroke-width="1.5" stroke-dasharray="6"/>

  <!-- 2. Auth & RBAC Interceptor -->
  <rect x="250" y="70" width="170" height="40" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="335" y="95" text-anchor="middle" fill="#fff" font-weight="bold" font-size="12">RBAC Interceptor</text>
  <line x1="335" y1="110" x2="335" y2="670" stroke="#334155" stroke-width="1.5" stroke-dasharray="6"/>

  <!-- 3. Trip & Expense Engine -->
  <rect x="490" y="70" width="180" height="40" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="580" y="95" text-anchor="middle" fill="#fff" font-weight="bold" font-size="12">Trip &amp; Expense Engine</text>
  <line x1="580" y1="110" x2="580" y2="670" stroke="#334155" stroke-width="1.5" stroke-dasharray="6"/>

  <!-- 4. Database & Audit Store -->
  <rect x="740" y="70" width="160" height="40" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <text x="820" y="95" text-anchor="middle" fill="#fff" font-weight="bold" font-size="12">Audit &amp; DB Store</text>
  <line x1="820" y1="110" x2="820" y2="670" stroke="#334155" stroke-width="1.5" stroke-dasharray="6"/>

  <!-- Step 1: Client Submits Expense -->
  <line x1="120" y1="150" x2="335" y2="150" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="220" y="142" text-anchor="middle" fill="#38bdf8" font-size="11">1: POST /expenses (Bearer Token)</text>

  <!-- Step 2: RBAC Validates Membership & Role -->
  <rect x="325" y="165" width="20" height="60" fill="#f59e0b"/>
  <text x="340" y="195" fill="#f59e0b" font-size="11">2: Verify Role in [owner, editor]</text>

  <!-- Step 2a: Alternative Flow - Viewer Unauthorized Attempt -->
  <line x1="335" y1="240" x2="120" y2="240" stroke="#ef4444" stroke-width="2" stroke-dasharray="4"/>
  <text x="220" y="232" text-anchor="middle" fill="#ef4444" font-size="11">[Alt: Role == 'viewer'] 403 Forbidden</text>

  <line x1="335" y1="260" x2="820" y2="260" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="580" y="252" text-anchor="middle" fill="#ef4444" font-size="10">Log Violation: PRIVILEGE_VIOLATION_BLOCKED</text>

  <!-- Step 3: Happy Path - Forward to Business Logic -->
  <line x1="335" y1="310" x2="580" y2="310" stroke="#10b981" stroke-width="2"/>
  <text x="450" y="302" text-anchor="middle" fill="#10b981" font-size="11">3: Role Authorized -> Process Expense</text>

  <!-- Step 4: Validate Math & Balance Group Split -->
  <rect x="570" y="325" width="20" height="70" fill="#10b981"/>
  <text x="600" y="350" fill="#34d399" font-size="11">4: Calculate Shares</text>
  <text x="600" y="365" fill="#34d399" font-size="11">   Zero-Sum Verification</text>

  <!-- Step 5: Atomic Write to DB -->
  <line x1="580" y1="410" x2="820" y2="410" stroke="#10b981" stroke-width="2"/>
  <text x="700" y="402" text-anchor="middle" fill="#10b981" font-size="11">5: Atomic Insert to Expense Ledger</text>

  <!-- Step 6: Log Audit Trail -->
  <line x1="580" y1="450" x2="820" y2="450" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="700" y="442" text-anchor="middle" fill="#38bdf8" font-size="11">6: Log Event: EXPENSE_CREATED</text>

  <!-- Step 7: Return HTTP 201 Created to Client -->
  <line x1="580" y1="500" x2="120" y2="500" stroke="#10b981" stroke-width="2"/>
  <text x="350" y="492" text-anchor="middle" fill="#10b981" font-size="11">7: HTTP 201 Created (Expense Object)</text>

  <!-- Step 8: Subsequent Settlement Query -->
  <line x1="120" y1="550" x2="335" y2="550" stroke="#38bdf8" stroke-width="2"/>
  <text x="220" y="542" text-anchor="middle" fill="#38bdf8" font-size="11">8: GET /settlement-summary</text>

  <!-- Step 9: Minimum Transaction Reconciliation Engine -->
  <line x1="335" y1="580" x2="580" y2="580" stroke="#10b981" stroke-width="2"/>
  <rect x="570" y="590" width="20" height="40" fill="#10b981"/>
  <text x="600" y="615" fill="#34d399" font-size="11">9: Run Greedy Min-Transfer Solver</text>

  <line x1="580" y1="645" x2="120" y2="645" stroke="#10b981" stroke-width="2"/>
  <text x="350" y="637" text-anchor="middle" fill="#10b981" font-size="11">10: HTTP 200 OK (Settlement Matrix)</text>
</svg>
