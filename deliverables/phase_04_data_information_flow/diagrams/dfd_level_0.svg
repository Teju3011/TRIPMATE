<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="100%" height="100%" style="background:#0f172a; font-family:'Segoe UI',sans-serif;">
  <text x="450" y="40" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="bold">TripMate — Level-0 Context Data Flow Diagram</text>

  <!-- External Entities -->
  <!-- Entity 1: Trip Organizer / Owner -->
  <rect x="50" y="120" width="160" height="80" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="130" y="155" text-anchor="middle" fill="#fff" font-weight="bold" font-size="13">TRIP ORGANIZER</text>
  <text x="130" y="175" text-anchor="middle" fill="#f59e0b" font-size="11">[Trip Owner]</text>

  <!-- Entity 2: Co-Travelers / Collaborators -->
  <rect x="50" y="320" width="160" height="80" rx="8" fill="#1e293b" stroke="#0ea5e9" stroke-width="2"/>
  <text x="130" y="355" text-anchor="middle" fill="#fff" font-weight="bold" font-size="13">CO-TRAVELERS</text>
  <text x="130" y="375" text-anchor="middle" fill="#0ea5e9" font-size="11">[Editors / Viewers]</text>

  <!-- Entity 3: Security Compliance & Auditor -->
  <rect x="690" y="220" width="160" height="80" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <text x="770" y="255" text-anchor="middle" fill="#fff" font-weight="bold" font-size="13">SECURITY AUDITOR</text>
  <text x="770" y="275" text-anchor="middle" fill="#ef4444" font-size="11">[Platform Admin]</text>

  <!-- Central System Process (Bubble) -->
  <circle cx="450" cy="260" r="110" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  <text x="450" y="235" text-anchor="middle" fill="#38bdf8" font-size="16" font-weight="bold">PROCESS 0.0</text>
  <text x="450" y="260" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">TripMate Collaborative</text>
  <text x="450" y="280" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">Planning Engine</text>
  <text x="450" y="305" text-anchor="middle" fill="#94a3b8" font-size="11">[RBAC, Scheduling &amp; Splits]</text>

  <!-- Data Flow Arrows -->
  <!-- Owner to System -->
  <line x1="210" y1="140" x2="350" y2="210" stroke="#f59e0b" stroke-width="2"/>
  <text x="260" y="160" fill="#f59e0b" font-size="10">Create Trip, Invite Members, Roles</text>

  <line x1="350" y1="230" x2="210" y2="170" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="265" y="215" fill="#f59e0b" font-size="10">Trip Dashboard, Audit Confirmations</text>

  <!-- Collaborators to System -->
  <line x1="210" y1="340" x2="350" y2="300" stroke="#0ea5e9" stroke-width="2"/>
  <text x="240" y="315" fill="#0ea5e9" font-size="10">Add Activities, Expenses, Complete Tasks</text>

  <line x1="350" y1="320" x2="210" y2="370" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="240" y="360" fill="#0ea5e9" font-size="10">Itinerary Schedule, "Who Owes Whom"</text>

  <!-- System to Auditor -->
  <line x1="560" y1="250" x2="690" y2="250" stroke="#ef4444" stroke-width="2"/>
  <text x="625" y="240" text-anchor="middle" fill="#ef4444" font-size="10">Security Audit Logs, Alerts</text>

  <line x1="690" y1="270" x2="560" y2="270" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="625" y="285" text-anchor="middle" fill="#ef4444" font-size="10">Audit Queries &amp; Compliance Filters</text>
</svg>
