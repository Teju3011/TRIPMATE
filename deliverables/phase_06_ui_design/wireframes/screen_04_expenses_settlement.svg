<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="100%" height="100%" style="background:#0f172a; font-family:'Segoe UI',sans-serif;">
  <rect x="30" y="20" width="840" height="50" rx="8" fill="#1e293b"/>
  <text x="50" y="52" fill="#10b981" font-size="16" font-weight="bold">💰 TripMate — Group Expenses &amp; Debt Settlement Matrix</text>
  <rect x="740" y="30" width="110" height="32" rx="6" fill="#059669"/>
  <text x="795" y="51" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">+ Add Expense</text>

  <!-- Debt Settlement Matrix ("Who Owes Whom") Banner -->
  <rect x="30" y="85" width="840" height="110" rx="10" fill="#064e3b" stroke="#10b981"/>
  <text x="50" y="112" fill="#34d399" font-size="13" font-weight="bold">🤝 SIMPLIFIED DEBT SETTLEMENT MATRIX ("WHO OWES WHOM")</text>
  <text x="50" y="130" fill="#a7f3d0" font-size="11">Automated Zero-Sum Minimum Transfer Algorithm</text>

  <!-- Settlement Card 1 -->
  <rect x="50" y="142" width="370" height="42" rx="6" fill="#0f172a"/>
  <text x="70" y="167" fill="#fff" font-size="12" font-weight="bold">Bob Smith</text>
  <text x="175" y="167" fill="#10b981" font-size="12">owes →</text>
  <text x="250" y="167" fill="#fff" font-size="12" font-weight="bold">Alice Chen</text>
  <text x="390" y="167" text-anchor="end" fill="#10b981" font-size="13" font-weight="bold">$140.00</text>

  <!-- Settlement Card 2 -->
  <rect x="440" y="142" width="410" height="42" rx="6" fill="#0f172a"/>
  <text x="460" y="167" fill="#fff" font-size="12" font-weight="bold">Charlie Davis</text>
  <text x="580" y="167" fill="#10b981" font-size="12">owes →</text>
  <text x="655" y="167" fill="#fff" font-size="12" font-weight="bold">Alice Chen</text>
  <text x="825" y="167" text-anchor="end" fill="#10b981" font-size="13" font-weight="bold">$70.00</text>

  <!-- Category Breakdown Pills -->
  <rect x="30" y="210" width="840" height="55" rx="8" fill="#1e293b"/>
  <text x="50" y="242" fill="#94a3b8" font-size="11" font-weight="bold">CATEGORIES:</text>
  <rect x="140" y="224" width="130" height="26" rx="13" fill="#0f172a"/>
  <text x="205" y="241" text-anchor="middle" fill="#38bdf8" font-size="11">✈️ Flights: $1,260</text>
  <rect x="280" y="224" width="160" height="26" rx="13" fill="#0f172a"/>
  <text x="360" y="241" text-anchor="middle" fill="#38bdf8" font-size="11">🏨 Stays: $840</text>
  <rect x="450" y="224" width="150" height="26" rx="13" fill="#0f172a"/>
  <text x="525" y="241" text-anchor="middle" fill="#38bdf8" font-size="11">🚆 Transport: $690</text>
  <rect x="610" y="224" width="140" height="26" rx="13" fill="#0f172a"/>
  <text x="680" y="241" text-anchor="middle" fill="#38bdf8" font-size="11">🍽️ Food: $210</text>

  <!-- Expense Transactions Table -->
  <rect x="30" y="280" width="840" height="240" rx="8" fill="#1e293b"/>
  <!-- Table Header -->
  <rect x="30" y="280" width="840" height="35" rx="8" fill="#334155"/>
  <text x="50" y="302" fill="#cbd5e1" font-size="11" font-weight="bold">TITLE</text>
  <text x="260" y="302" fill="#cbd5e1" font-size="11" font-weight="bold">CATEGORY</text>
  <text x="380" y="302" fill="#cbd5e1" font-size="11" font-weight="bold">AMOUNT</text>
  <text x="480" y="302" fill="#cbd5e1" font-size="11" font-weight="bold">PAID BY</text>
  <text x="600" y="302" fill="#cbd5e1" font-size="11" font-weight="bold">SPLIT AMONG</text>
  <text x="780" y="302" fill="#cbd5e1" font-size="11" font-weight="bold">ACTIONS</text>

  <!-- Row 1 -->
  <text x="50" y="340" fill="#fff" font-size="12" font-weight="bold">Swiss Air Group Booking</text>
  <text x="260" y="340" fill="#38bdf8" font-size="11">Flights</text>
  <text x="380" y="340" fill="#fff" font-size="12" font-weight="bold">$1,260.00</text>
  <text x="480" y="340" fill="#f59e0b" font-size="11">Alice Chen</text>
  <text x="600" y="340" fill="#94a3b8" font-size="11">3 Members ($420 ea)</text>
  <text x="780" y="340" fill="#f43f5e" font-size="11">Delete</text>

  <!-- Row 2 -->
  <text x="50" y="385" fill="#fff" font-size="12" font-weight="bold">Interlaken Chalet Rental</text>
  <text x="260" y="385" fill="#38bdf8" font-size="11">Accommodation</text>
  <text x="380" y="385" fill="#fff" font-size="12" font-weight="bold">$840.00</text>
  <text x="480" y="385" fill="#0ea5e9" font-size="11">Bob Smith</text>
  <text x="600" y="385" fill="#94a3b8" font-size="11">3 Members ($280 ea)</text>
  <text x="780" y="385" fill="#f43f5e" font-size="11">Delete</text>

  <!-- Row 3 -->
  <text x="50" y="430" fill="#fff" font-size="12" font-weight="bold">Swiss Rail Travel Passes</text>
  <text x="260" y="430" fill="#38bdf8" font-size="11">Transport</text>
  <text x="380" y="430" fill="#fff" font-size="12" font-weight="bold">$690.00</text>
  <text x="480" y="430" fill="#f59e0b" font-size="11">Alice Chen</text>
  <text x="600" y="430" fill="#94a3b8" font-size="11">3 Members ($230 ea)</text>
  <text x="780" y="430" fill="#f43f5e" font-size="11">Delete</text>

  <!-- Row 4 -->
  <text x="50" y="475" fill="#fff" font-size="12" font-weight="bold">Welcome Fondue Dinner</text>
  <text x="260" y="475" fill="#38bdf8" font-size="11">Food</text>
  <text x="380" y="475" fill="#fff" font-size="12" font-weight="bold">$210.00</text>
  <text x="480" y="475" fill="#94a3b8" font-size="11">Charlie Davis</text>
  <text x="600" y="475" fill="#94a3b8" font-size="11">3 Members ($70 ea)</text>
  <text x="780" y="475" fill="#f43f5e" font-size="11">Delete</text>
</svg>
