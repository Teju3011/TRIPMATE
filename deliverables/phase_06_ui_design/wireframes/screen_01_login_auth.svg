<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background:#0f172a; font-family:'Segoe UI',sans-serif;">
  <rect x="200" y="50" width="400" height="400" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="400" y="90" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold">TripMate Authentication</text>
  <text x="400" y="115" text-anchor="middle" fill="#94a3b8" font-size="12">Secure JWT &amp; Role-Based Identity</text>

  <!-- Input 1: Email -->
  <text x="230" y="155" fill="#cbd5e1" font-size="11">Email Address</text>
  <rect x="230" y="165" width="340" height="36" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="245" y="188" fill="#64748b" font-size="12">alice@tripmate.io</text>

  <!-- Input 2: Password -->
  <text x="230" y="225" fill="#cbd5e1" font-size="11">Password</text>
  <rect x="230" y="235" width="340" height="36" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="245" y="258" fill="#64748b" font-size="12">••••••••••••••</text>

  <!-- Login Button -->
  <rect x="230" y="295" width="340" height="40" rx="6" fill="#0284c7"/>
  <text x="400" y="320" text-anchor="middle" fill="#fff" font-weight="bold" font-size="13">Sign In to Dashboard</text>

  <!-- Fast Persona Switcher Box -->
  <rect x="230" y="355" width="340" height="70" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-dasharray="4"/>
  <text x="400" y="375" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="bold">⚡ Fast RBAC Test Persona Switcher</text>
  <rect x="245" y="388" width="95" height="26" rx="13" fill="#f59e0b"/>
  <text x="292" y="405" text-anchor="middle" fill="#000" font-size="10" font-weight="bold">👑 Alice (Owner)</text>
  <rect x="352" y="388" width="95" height="26" rx="13" fill="#0ea5e9"/>
  <text x="399" y="405" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">✏️ Bob (Editor)</text>
  <rect x="460" y="388" width="95" height="26" rx="13" fill="#64748b"/>
  <text x="507" y="405" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">👁️ Charlie (View)</text>
</svg>
