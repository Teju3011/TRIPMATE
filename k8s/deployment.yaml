apiVersion: apps/v1
kind: Deployment
metadata:
  name: tripmate-deployment
  namespace: tripmate-production
  labels:
    app.kubernetes.io/name: tripmate
    app.kubernetes.io/instance: production
    app.kubernetes.io/component: backend-web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: tripmate
  template:
    metadata:
      labels:
        app: tripmate
    spec:
      # Kubernetes Security Control 1: Non-root Pod Security Standards
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tripmate-engine
          image: tripmate:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http-web
              protocol: TCP
          # Kubernetes Security Control 2: Container Security Context
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: tripmate-config
            - secretRef:
                name: tripmate-secret
          # Kubernetes Security Control 3: Strict Compute Resource Limits
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # Liveness and Readiness Probes
          livenessProbe:
            httpGet:
              path: /health
              port: http-web
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http-web
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
          volumeMounts:
            - name: tripmate-persistent-data
              mountPath: /usr/src/app/data
      volumes:
        - name: tripmate-persistent-data
          persistentVolumeClaim:
            claimName: tripmate-data-pvc
